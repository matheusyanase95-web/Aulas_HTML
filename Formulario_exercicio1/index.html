<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario exercicio</title>
</head>
<figure>
</figure>
<body>
    
    <img src="img/trello.svg" width="200">


    <h1>Fazer login no Trello</h1>

    <form>
        <label for="email">Email</label>
        <input type="text" name="" id="" placeholder="Digita seu email">

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha"/>

        <button type="submit">Fazer login</button> <span>Ou</span>

        <button type="button">
            <img src="img/google.svg" alt="Google" width="16">Continuar com o Google </button>

        <button type="submit">
            <img src="img/microsoft.svg" alt="Microsoft" width="16" height="16">Continuas com o Microsoft</button>
       
        <button type="submit">
            <img src="img/apple.svg" alt="Apple" width="16" height="16">Continuas com a Apple</button>
        
        <button type="submit">
            <img src="img/slack.svg" alt="Slack" width="16" height="16">Continuas com o slack</button>

        <img src="img/atlassian.svg" width="200">
        <img src="img/analytics.svg" width="200">
        <img src="img/interactive.svg" width="200">

        <br>
        <br>
    </form>
</body>
</html>
