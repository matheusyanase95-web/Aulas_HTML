<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário Exercício</title>

    <script src="./js/stylesheet.js" defer></script>
</head>

<body>

    <img src="img/trello.svg" alt="Logo Trello" width="200">

    <h1>Fazer login no Trello</h1>

    <form action="">

        <label for="email">Email</label>
        <input
            type="email"
            name="email"
            id="email"
            placeholder="Digite seu email"
        >

        <label for="senha">Senha</label>
        <input
            type="password"
            name="senha"
            id="senha"
            placeholder="Digite sua senha"
        >

        <button type="submit">
            Fazer login
        </button>

        <span>Ou</span>

        <button type="button">
            <img src="img/google.svg" alt="Logo Google" width="20">
            Continuar com o Google
        </button>

        <button type="button">
            <img src="img/microsoft.svg" alt="Logo Microsoft" width="20">
            Continuar com a Microsoft
        </button>

        <button type="button">
            <img src="img/apple.svg" alt="Logo Apple" width="20">
            Continuar com a Apple
        </button>

        <button type="button">
            <img src="img/slack.svg" alt="Logo Slack" width="20">
            Continuar com o Slack
        </button>

    </form>

    <img src="img/atlassian.svg" alt="Atlassian" width="200">

    <img src="img/analytics.svg" alt="Analytics" width="200">

    <img src="img/interactive.svg" alt="Interactive" width="200">

</body>

</html>
