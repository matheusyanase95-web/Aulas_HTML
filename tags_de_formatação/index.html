<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulário HTML</h1>

    <form>
        <label for="nome">Nome</label>
        <input type="text" name=""id="nome"placeholder="Ex: Antonio Carlos"/>
        <br>
        <br>

        <label for="">Email</label>
        <input type="email" id="email" name="" placeholder="exmeplo@exemplo.com.br"/> 
        <br>
        <br>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha"/>

        <label for="">Gênero</label>
        <input type="radio" name="gênero" id="masculino" value="masculino"/>
        <label for="">Masculino</label>

        <input type="radio" name="gênero" id="feminino" value="feminino"/>
        <label for="">Feminino</label>

        <input type="radio" name="gênero" id="outros"value="outros"/>
        <label for="">Outros</label>

        <br/>
        <br/>

        <span>Estilo Musical:</span>
        <input type="checkbox" name="estiloMusical" id="estiloMusicalPop" value="Pop">
        <label for="">Pop</label>

        <input type="checkbox" name="estiloMusical" id="estiloMusicalRock" value="Rock">
        <label for="estiloMusicalRock">Rock</label>

        <input type="checkbox" name="estiloMusical" id="estiloMusicalGospel" value="Gospel">
        <label for="estiloMusicalGospel">Gospel</label>

        <input type="checkbox" name="estiloMusical" id="estiloMusicalSamba" value="Samba">
        <label for="estiloMusicalSamba">Samba</label>


        <br/>
        <br/>

        <label for="">DescriçâoId</label>
        <textarea name="descricao" id="descricaoId" placeholder="Digite uma descrição"></textarea>

        <br/>
        <br/>

        <label for="">Selecione um Estado</label>
        <select name="estados" id="estadosId">
            <option value="">Selecione um Estado</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
        </select>

        <br/>
        <br/>

        <fieldset>
            <legend>Dados PessoaisID</legend>
            <label for="">Nome Completo</label>
            <input type="text" name="Nome Completo" id="nomeCompletoId"/>

            <label for="dataNascimentoId">Data nascimeto:</label>
            <input type="date" name="dataNascimento" id="dataNascimentoId">
        </fieldset>

        <br />
        <br />
       <button type="submit">Enviar</button>
    </form>
</body>
</html>
